<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>NHL Game Model – Data Viewer</title>

  <!-- Bootstrap 5 – CSS (for modal & layout) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- DataTables – CSS (for sorting, filtering, pagination) -->
  <link href="https://cdn.jsdelivr.net/npm/datatables@1.13.6/media/css/jquery.dataTables.min.css" rel="stylesheet"/>

  <!-- jQuery 3.x (required by DataTables) -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

  <!-- PapaParse – CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <!-- DataTables – JS -->
  <script src="https://cdn.jsdelivr.net/npm/datatables@1.13.6/media/js/jquery.dataTables.min.js"></script>

  <!-- Bootstrap 5 – JS (for modal) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body{font-family:Arial,Helvetica,sans-serif;padding:20px;}
    #tables table{margin-bottom:30px;width:100%}
  </style>
</head>
<body>
  <h1>NHL Game Model – Data Viewer</h1>
  <div id="tables"></div>

  <!-- Modal placeholder -->
  <div class="modal fade" id="rowModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Row Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <!-- Our custom loader -->
  <script src="data.js"></script>
</body>
</html>
